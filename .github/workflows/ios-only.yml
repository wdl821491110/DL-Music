name: iOS Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build-ios:
    # 两个池并发排队，谁先分到机器谁出包，互不拖累。
    # macos-15/macOS-latest 预装 Xcode 26.x（Swift 6.2），构建前 xcode-select 切过去；
    # 用默认 Xcode 16.4（Swift 6.1）会因依赖要求 Swift 6.2 而编译失败。
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-latest]
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Select Xcode 26.x (Swift 6.2)
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix api install
          npm run generate:mobile-api

      # expo-audio 原生未注册锁屏「上一首/下一首」命令，npm ci 之后覆盖其 Swift 源码。
      - name: Apply lock screen track commands patch
        run: cp patches/expo-audio/ios/MediaController.swift node_modules/expo-audio/ios/MediaController.swift

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --no-install

      # RN 0.86 的 pod install 会从 Maven CDN 下载预编译包，脚本用单次 curl 无重试，
      # GitHub runner 到 CDN 偶发 Connection reset 导致失败。先带重试预下载到 RN 的
      # 产物目录，脚本发现文件已存在会跳过下载。
      - name: Prefetch RN prebuilt tarballs
        run: |
          VER=$(node -p "require('./node_modules/react-native/package.json').version")
          DIR=ios/Pods/ReactNativeCore-artifacts
          mkdir -p "$DIR"
          BASE="https://repo1.maven.org/maven2/com/facebook/react/react-native-artifacts/$VER"
          for CFG in debug release; do
            F="reactnative-core-$VER-$CFG.tar.gz"
            if [ -s "$DIR/$F" ]; then echo "already have $F"; continue; fi
            echo "prefetch $F ..."
            curl -A "react-native-$VER" -fL --retry 6 --retry-delay 3 --retry-all-errors \
              "$BASE/react-native-artifacts-$VER-reactnative-core-$CFG.tar.gz" -o "$DIR/$F"
            ls -lh "$DIR/$F"
          done

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          for i in 1 2 3; do
            echo "pod install attempt $i/3"
            pod install && exit 0
            echo "pod install failed, retrying..."
            sleep 5
          done
          echo "pod install failed after 3 attempts"
          exit 1

      # 关闭代码签名构建 archive，产出未签名 IPA，供用户自行签名安装
      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -workspace ios/DLMusic.xcworkspace \
            -scheme DLMusic \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DLMusic.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA
        run: |
          mkdir -p dist Payload
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          cp -R "build/DLMusic.xcarchive/Products/Applications/DLMusic.app" Payload/
          zip -qry "dist/DL-Music-${VERSION}-ios-unsigned.ipa" Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ matrix.runner }}
          path: dist/*
